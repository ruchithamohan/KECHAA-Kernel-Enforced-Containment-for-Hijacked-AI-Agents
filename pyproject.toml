[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "kechaa"
version = "0.2.0a1"
description = "Approval-bound effect envelopes for agent actions"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML==6.0.3", "cryptography==48.0.1", "cffi==2.0.0", "pycparser==3.0"]

[project.scripts]
kechaa = "kechaa.cli:main"

[tool.setuptools.packages.find]
include = ["kechaa*"]
