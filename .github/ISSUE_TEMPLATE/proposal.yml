name: Integration or improvement
description: Propose a concrete workflow or explain an adoption problem.
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow and current obstacle
      description: Who needs this, which tool/version, what cannot be done today?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Proposed behavior and security boundary
      description: How would it preserve identity, approvals and fail-closed execution? What would remain out of scope?
